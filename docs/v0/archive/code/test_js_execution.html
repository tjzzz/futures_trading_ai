<!DOCTYPE html>
<html>
<head>
    <title>测试JavaScript执行</title>
    <style>
        .indicator-card {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 16px;
            margin: 10px;
        }
        .indicator-price {
            font-size: 24px;
            font-weight: 700;
        }
        .change-value.positive { color: green; }
        .change-value.negative { color: red; }
    </style>
</head>
<body>
    <h1>JavaScript执行测试</h1>
    
    <div id="card-gold" class="indicator-card">
        <div class="indicator-price">$0.00</div>
        <div class="indicator-change">
            <span class="change-value">0.00</span>
            <span class="change-percent">(0.00%)</span>
        </div>
    </div>
    
    <div id="test-result"></div>
    
    <script>
        // 测试1：检查页面元素
        console.log('测试1：检查页面元素');
        var card = document.getElementById('card-gold');
        console.log('卡片元素:', card);
        
        if (card) {
            console.log('卡片找到，开始更新');
            var priceEl = card.querySelector('.indicator-price');
            var changeEl = card.querySelector('.change-value');
            var percentEl = card.querySelector('.change-percent');
            
            console.log('价格元素:', priceEl);
            console.log('变化元素:', changeEl);
            console.log('百分比元素:', percentEl);
            
            if (priceEl) {
                priceEl.textContent = '$4495.00';
                console.log('价格更新成功');
            }
            
            if (changeEl && percentEl) {
                changeEl.textContent = '+25.40';
                changeEl.className = 'change-value positive';
                percentEl.textContent = '(0.56%)';
                console.log('变化值更新成功');
            }
            
            document.getElementById('test-result').innerHTML = 
                '<h3>测试结果：成功</h3>' +
                '<p>页面元素找到并更新成功</p>';
        } else {
            console.error('卡片元素未找到');
            document.getElementById('test-result').innerHTML = 
                '<h3>测试结果：失败</h3>' +
                '<p>卡片元素未找到</p>';
        }
        
        // 测试2：检查API调用
        console.log('测试2：检查API调用');
        fetch('/api/realtime/indicators')
            .then(r => r.json())
            .then(data => {
                console.log('API数据:', data);
                document.getElementById('test-result').innerHTML += 
                    '<p>API调用成功：黄金价格=' + data.gold.price + '</p>';
            })
            .catch(e => {
                console.error('API调用失败:', e);
                document.getElementById('test-result').innerHTML += 
                    '<p>API调用失败：' + e.message + '</p>';
            });
    </script>
</body>
</html>
