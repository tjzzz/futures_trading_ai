<!DOCTYPE html>
<html>
<head>
    <title>测试JavaScript函数</title>
</head>
<body>
    <h1>JavaScript函数测试</h1>
    
    <div id="card-gold" class="indicator-card">
        <div class="indicator-price">$0.00</div>
        <div class="indicator-change">
            <span class="change-value">0.00</span>
            <span class="change-percent">(0.00%)</span>
        </div>
        <div class="indicator-status normal">正常</div>
    </div>
    
    <button onclick="testFunctions()">测试函数</button>
    <div id="result"></div>
    
    <script>
        function formatPrice(value) {
            if (typeof value !== 'number') return '$0.00';
            return '$' + value.toFixed(2);
        }
        
        function formatNumber(value, decimals) {
            if (typeof value !== 'number') return '0.00';
            return value.toFixed(decimals || 2);
        }
        
        function formatPercent(value) {
            if (typeof value !== 'number') return '0.00%';
            return value.toFixed(2) + '%';
        }
        
        function updateCard(cardId, data) {
            console.log('更新卡片:', cardId, '数据:', data);
            
            var card = document.getElementById('card-' + cardId);
            if (!card) {
                console.error('卡片元素不存在: #card-' + cardId);
                return;
            }

            // 更新价格/数值
            var priceEl = card.querySelector('.indicator-price') || card.querySelector('.indicator-value');
            if (priceEl) {
                if (cardId === 'gold' || cardId === 'silver') {
                    console.log('设置价格:', cardId, data.price);
                    priceEl.textContent = data.price;
                } else if (cardId === 'bond') {
                    console.log('设置百分比:', cardId, data.value);
                    priceEl.textContent = data.value;
                } else {
                    console.log('设置数值:', cardId, data.value);
                    priceEl.textContent = data.value;
                }
            } else {
                console.error('价格元素不存在于卡片:', cardId);
            }

            // 更新变化值
            var changeValueEl = card.querySelector('.change-value');
            var changePercentEl = card.querySelector('.change-percent');
            if (changeValueEl) {
                var change = data.change || 0;
                var pctChange = data.pctChange || 0;
                
                changeValueEl.textContent = (change >= 0 ? '+' : '') + change.toFixed(2);
                changePercentEl.textContent = '(' + (pctChange >= 0 ? '+' : '') + pctChange.toFixed(2) + '%)';
                
                // 设置颜色
                if (change > 0) {
                    changeValueEl.className = 'change-value positive';
                } else if (change < 0) {
                    changeValueEl.className = 'change-value negative';
                } else {
                    changeValueEl.className = 'change-value';
                }
                console.log('设置变化值:', change, pctChange);
            } else {
                console.error('变化值元素不存在于卡片:', cardId);
            }

            // 更新状态
            var statusEl = card.querySelector('.indicator-status');
            if (statusEl) {
                statusEl.textContent = data.status === 'normal' ? '正常' : '异常';
                statusEl.className = 'indicator-status ' + (data.status || 'normal');
                console.log('设置状态:', data.status);
            } else {
                console.error('状态元素不存在于卡片:', cardId);
            }
            
            console.log('卡片更新完成:', cardId);
        }
        
        function testFunctions() {
            console.log('=== 开始测试函数 ===');
            
            // 测试格式化函数
            console.log('formatPrice(4495.0) =', formatPrice(4495.0));
            console.log('formatPrice(74.22) =', formatPrice(74.22));
            console.log('formatNumber(60.56, 2) =', formatNumber(60.56, 2));
            console.log('formatPercent(4.591) =', formatPercent(4.591));
            
            // 测试更新卡片
            updateCard('gold', {
                price: formatPrice(4495.0),
                change: 25.4,
                pctChange: 0.56,
                status: 'normal'
            });
            
            document.getElementById('result').innerHTML = 
                '<h3>测试完成</h3>' +
                '<p>formatPrice(4495.0) = ' + formatPrice(4495.0) + '</p>' +
                '<p>formatPrice(74.22) = ' + formatPrice(74.22) + '</p>' +
                '<p>formatNumber(60.56, 2) = ' + formatNumber(60.56, 2) + '</p>' +
                '<p>formatPercent(4.591) = ' + formatPercent(4.591) + '</p>';
        }
        
        // 页面加载时自动测试
        window.onload = function() {
            console.log('页面加载完成');
            testFunctions();
        };
    </script>
</body>
</html>
