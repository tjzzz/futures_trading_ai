<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>因果图测试</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  margin: 0;
  padding: 20px;
  background: #f5f5f7;
}
.test-container {
  max-width: 1000px;
  margin: 0 auto;
  background: white;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
.test-section {
  margin-bottom: 30px;
  padding: 20px;
  border: 1px solid #e5e5e5;
  border-radius: 8px;
}
h2 {
  color: #333;
  margin-top: 0;
}
.result {
  padding: 10px;
  background: #f8f9fa;
  border-radius: 6px;
  margin-top: 10px;
  font-family: monospace;
  font-size: 14px;
}
.success {
  color: #10b981;
  font-weight: bold;
}
.error {
  color: #ef4444;
  font-weight: bold;
}
.warning {
  color: #f59e0b;
}
#causal-container {
  width: 100%;
  height: 400px;
  border: 1px solid #e5e5e5;
  border-radius: 8px;
  margin-top: 20px;
  position: relative;
}
</style>
</head>
<body>
<div class="test-container">
  <h1>因果图功能测试</h1>
  
  <div class="test-section">
    <h2>测试1: D3.js库加载</h2>
    <div id="test-d3" class="result">正在测试...</div>
  </div>
  
  <div class="test-section">
    <h2>测试2: API连接</h2>
    <div id="test-api" class="result">正在测试...</div>
  </div>
  
  <div class="test-section">
    <h2>测试3: D3.js图表绘制</h2>
    <div id="causal-container">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #666;">
        <div style="font-size: 48px; margin-bottom: 16px;">📊</div>
        <div style="font-size: 16px; font-weight: 500; margin-bottom: 8px;">因果图测试区域</div>
        <div style="font-size: 13px; text-align: center; max-width: 300px;">
          如果测试成功，这里将显示D3.js力导向图
        </div>
      </div>
    </div>
    <div id="test-drawing" class="result">正在测试...</div>
  </div>
  
  <div class="test-section">
    <h2>测试4: 完整功能集成</h2>
    <button id="test-integration-btn" style="padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">
      测试完整因果图功能
    </button>
    <div id="test-integration" class="result">点击按钮开始测试</div>
  </div>
</div>

<script>
// 测试1: D3.js库加载
const testD3 = document.getElementById('test-d3');
if (typeof d3 !== 'undefined') {
  testD3.innerHTML = '<span class="success">✅ D3.js v' + d3.version + ' 已成功加载</span>';
  console.log('D3.js版本:', d3.version);
} else {
  testD3.innerHTML = '<span class="error">❌ D3.js库未加载</span>';
}

// 测试2: API连接
const testApi = document.getElementById('test-api');
fetch('http://localhost:8082/api/realtime/causal')
  .then(response => {
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }
    return response.json();
  })
  .then(data => {
    testApi.innerHTML = `<span class="success">✅ API连接成功</span><br>
      节点数: ${data.nodes.length}<br>
      链接数: ${data.links.length}<br>
      更新时间: ${data.metadata.update_time}`;
    console.log('API数据:', data);
    window.causalData = data; // 保存数据供后续测试使用
  })
  .catch(error => {
    testApi.innerHTML = `<span class="error">❌ API连接失败</span><br>错误: ${error.message}`;
    console.error('API错误:', error);
  });

// 测试3: D3.js基本绘图能力
const testDrawing = document.getElementById('test-drawing');
const container = document.getElementById('causal-container');

setTimeout(() => {
  if (typeof d3 !== 'undefined' && container) {
    try {
      // 创建简单的SVG测试
      const svg = d3.select(container)
        .append('svg')
        .attr('width', 600)
        .attr('height', 400);
      
      // 绘制测试图形
      svg.append('circle')
        .attr('cx', 100)
        .attr('cy', 100)
        .attr('r', 40)
        .attr('fill', '#f59e0b')
        .attr('stroke', '#fff')
        .attr('stroke-width', 2);
      
      svg.append('circle')
        .attr('cx', 200)
        .attr('cy', 200)
        .attr('r', 30)
        .attr('fill', '#3b82f6')
        .attr('stroke', '#fff')
        .attr('stroke-width', 2);
      
      svg.append('line')
        .attr('x1', 100)
        .attr('y1', 100)
        .attr('x2', 200)
        .attr('y2', 200)
        .attr('stroke', '#4ade80')
        .attr('stroke-width', 3)
        .attr('marker-end', 'url(#test-arrow)');
      
      // 添加箭头标记
      const defs = svg.append('defs');
      defs.append('marker')
        .attr('id', 'test-arrow')
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 25)
        .attr('refY', 0)
        .attr('markerWidth', 6)
        .attr('markerHeight', 6)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', '#999');
      
      testDrawing.innerHTML = '<span class="success">✅ D3.js绘图功能正常</span>';
    } catch (error) {
      testDrawing.innerHTML = `<span class="error">❌ D3.js绘图失败</span><br>错误: ${error.message}`;
      console.error('绘图错误:', error);
    }
  } else {
    testDrawing.innerHTML = '<span class="warning">⚠️ 无法测试绘图功能</span>';
  }
}, 1000);

// 测试4: 完整功能集成
document.getElementById('test-integration-btn').addEventListener('click', function() {
  const testResult = document.getElementById('test-integration');
  testResult.innerHTML = '正在测试完整因果图功能...';
  
  if (!window.causalData) {
    testResult.innerHTML = '<span class="error">❌ 请先等待API数据加载完成</span>';
    return;
  }
  
  try {
    // 清除容器中的测试内容
    d3.select(container).selectAll('*').remove();
    
    // 使用实际数据绘制力导向图
    const nodes = window.causalData.nodes;
    const links = window.causalData.links;
    
    const width = 600;
    const height = 400;
    
    const svg = d3.select(container)
      .append('svg')
      .attr('width', width)
      .attr('height', height);
    
    // 创建力导向图模拟
    const simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(100))
      .force('charge', d3.forceManyBody().strength(-300))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force('collision', d3.forceCollide().radius(40));
    
    // 创建链接
    const link = svg.append('g')
      .attr('class', 'links')
      .selectAll('line')
      .data(links)
      .enter()
      .append('line')
      .attr('stroke-width', d => Math.abs(d.strength) * 3)
      .attr('stroke', d => d.strength > 0 ? '#4ade80' : '#f87171')
      .attr('stroke-opacity', 0.6)
      .attr('marker-end', 'url(#full-arrow)');
    
    // 创建箭头标记
    const defs = svg.append('defs');
    defs.append('marker')
      .attr('id', 'full-arrow')
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 25)
      .attr('refY', 0)
      .attr('markerWidth', 6)
      .attr('markerHeight', 6)
      .attr('orient', 'auto')
      .append('path')
      .attr('d', 'M0,-5L10,0L0,5')
      .attr('fill', '#999');
    
    // 创建节点
    const node = svg.append('g')
      .attr('class', 'nodes')
      .selectAll('g')
      .data(nodes)
      .enter()
      .append('g');
    
    node.append('circle')
      .attr('r', d => 20 + d.value * 15)
      .attr('fill', d => {
        const colors = {1: '#f59e0b', 2: '#8b5cf6', 3: '#3b82f6', 4: '#ef4444'};
        return colors[d.group] || '#6b7280';
      })
      .attr('stroke', '#fff')
      .attr('stroke-width', 2);
    
    node.append('text')
      .text(d => d.name)
      .attr('text-anchor', 'middle')
      .attr('dy', '.35em')
      .attr('fill', '#fff')
      .attr('font-size', '12px')
      .attr('font-weight', 'bold');
    
    // 更新力导向图位置
    simulation.on('tick', () => {
      link
        .attr('x1', d => d.source.x)
        .attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x)
        .attr('y2', d => d.target.y);
      
      node
        .attr('transform', d => `translate(${d.x},${d.y})`);
    });
    
    testResult.innerHTML = '<span class="success">✅ 完整因果图功能测试成功</span><br>' +
      `已绘制 ${nodes.length} 个节点和 ${links.length} 个链接`;
    
  } catch (error) {
    testResult.innerHTML = `<span class="error">❌ 完整功能测试失败</span><br>错误: ${error.message}`;
    console.error('集成测试错误:', error);
  }
});
</script>
</body>
</html>
