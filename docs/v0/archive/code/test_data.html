<!DOCTYPE html>
<html>
<head>
    <title>测试实时数据</title>
    <script>
        async function testAllAPIs() {
            const apis = [
                { name: '指标数据', url: '/api/realtime/indicators' },
                { name: '趋势数据', url: '/api/realtime/trend' },
                { name: '突变数据', url: '/api/realtime/mutations' },
                { name: '相关数据', url: '/api/realtime/correlation' },
                { name: '因果数据', url: '/api/realtime/causal' }
            ];
            
            const results = document.getElementById('results');
            results.innerHTML = '';
            
            for (const api of apis) {
                const item = document.createElement('div');
                item.innerHTML = `<h3>${api.name} (${api.url})</h3><pre id="${api.name}">加载中...</pre>`;
                results.appendChild(item);
                
                try {
                    const response = await fetch(api.url);
                    const data = await response.json();
                    document.getElementById(api.name).textContent = JSON.stringify(data, null, 2);
                } catch (error) {
                    document.getElementById(api.name).textContent = `错误: ${error.message}`;
                }
            }
        }
        
        window.onload = testAllAPIs;
    </script>
</head>
<body>
    <h1>实时探查API测试</h1>
    <button onclick="testAllAPIs()">重新测试</button>
    <div id="results"></div>
</body>
</html>
